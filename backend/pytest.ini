[pytest]
# Two offline suites are collected by default:
#   solver/tests — pure NumPy numerics, no dependencies beyond numpy+pytest
#   tests        — the simulation pipeline and API, with the DEM fetch stubbed
# Neither needs Earth Engine credentials or a network. `test_gee.py` in the
# backend root is a live connectivity proof script, not a unit test, so a bare
# `pytest` must not pick it up.
testpaths = solver/tests tests
python_files = test_*.py
addopts = -q --strict-markers
